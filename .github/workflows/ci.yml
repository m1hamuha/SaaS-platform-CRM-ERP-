name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Validate the workflow files themselves so a malformed YAML can never
  # silently disable CI again (this repo previously shipped unparseable
  # workflows for weeks).
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    # Advisory gate: surfaces workflow problems without blocking merges. The
    # hard protection against malformed workflows is GitHub itself (it refuses
    # to run unparseable YAML). Promoted to a required check once stabilized.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint (syntax + action usage; shellcheck off)
        # shellcheck is intentionally disabled here — legacy `run:` shell in
        # bvt.yml is hardened in Phase 7. This gate exists to catch the
        # YAML/workflow-syntax breakage that previously disabled CI entirely.
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -shellcheck= -color

  backend:
    name: Backend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests=false
        env:
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

      - name: Build
        run: npm run build

  # Proves the app actually boots and serves traffic against a real
  # Postgres + Redis (previously unverifiable — the e2e tier could not even
  # bootstrap). This is the harness the persistence phase builds on.
  integration:
    name: Integration (app boots against Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Boot app and verify it serves /health/liveness
        run: |
          node dist/main.js &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/v1/health/liveness >/dev/null; then
              echo "App is live after ${i} attempt(s)"; ok=1; break
            fi
            sleep 2
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "App failed to become healthy"; exit 1; fi
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: crm_erp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-integration-secret
          JWT_REFRESH_SECRET: ci-integration-refresh-secret
          NODE_ENV: test
          PORT: 3001

  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --passWithNoTests=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: '1'

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
