name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Validate the workflow files themselves so a malformed YAML can never
  # silently disable CI again (this repo previously shipped unparseable
  # workflows for weeks).
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    # Advisory gate: surfaces workflow problems without blocking merges. The
    # hard protection against malformed workflows is GitHub itself (it refuses
    # to run unparseable YAML). Promoted to a required check once stabilized.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint (syntax + action usage; shellcheck off)
        # shellcheck is intentionally disabled here — legacy `run:` shell in
        # bvt.yml is hardened in Phase 7. This gate exists to catch the
        # YAML/workflow-syntax breakage that previously disabled CI entirely.
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -shellcheck= -color

  backend:
    name: Backend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests=false
        env:
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

      - name: Build
        run: npm run build

      # NOTE: integration (test:e2e), smoke and acceptance suites require a
      # live Postgres + Redis and a working migration/seed path. They are
      # re-enabled here in the persistence phase (see docs/HARDENING_ROADMAP.md
      # Phase 1) once the suite no longer asserts unimplemented behaviour.

  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --passWithNoTests=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: '1'

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
